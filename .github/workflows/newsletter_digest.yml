name: Newsletter Digest

on:
  # 5:30 UTC = 11:00 IST (UTC+5:30)
  schedule:
    - cron: "30 5 * * *"
  # Allow manual trigger from the GitHub UI
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Gmail credentials from secrets
        run: |
          echo "${{ secrets.GMAIL_CREDS_JSON }}" | base64 -d > credentials.json
          echo "${{ secrets.GMAIL_TOKEN_JSON }}"  | base64 -d > token.json

      - name: Run Newsletter Digest Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_RECIPIENT: amit.das@think360.ai
          GMAIL_SENDER: amitdas@gmail.com
          GMAIL_TOKEN_FILE: token.json
          GMAIL_CREDS_FILE: credentials.json
          LOG_LEVEL: INFO
        run: python run.py

      - name: Clean up credentials
        if: always()
        run: |
          rm -f credentials.json token.json
